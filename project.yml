name: LuciControl
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    macOS: '14.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 0.1.2
    CURRENT_PROJECT_VERSION: 5
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: M7ZSWL69E9
    ARCHS: 'arm64 x86_64'
    ONLY_ACTIVE_ARCH: 'NO'
    ENABLE_HARDENED_RUNTIME: 'YES'
    ENABLE_USER_SCRIPT_SANDBOXING: 'NO'
  configs:
    Debug:
      ENABLE_HARDENED_RUNTIME: 'NO'
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  LuciControlCore:
    path: .
targets:
  LuciControl:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/Views
      - path: Resources
        excludes: [LaunchAgents]
    dependencies:
      - package: LuciControlCore
      - package: Sparkle
    preBuildScripts:
      - name: Build lucirund
        script: "\"$SRCROOT/scripts/build-daemon.sh\""
        outputFiles: ["$(SRCROOT)/build/lucirund"]
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Bundle lucirund
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH"
          cp -f "$SRCROOT/build/lucirund" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/lucirund"
          set -eu
          identity="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          if [ "$identity" = "-" ]; then
            codesign --force --sign - "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/lucirund"
          else
            codesign --force --sign "$identity" --options runtime --timestamp "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/lucirund"
          fi
        inputFiles: ["$(SRCROOT)/build/lucirund"]
        outputFiles: ["$(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/lucirund"]
      - name: Bundle launch agent
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents"
          cp -f "$SRCROOT/Resources/LaunchAgents/com.his1devil.lucicontrol.plist" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents/"
        inputFiles: ["$(SRCROOT)/Resources/LaunchAgents/com.his1devil.lucicontrol.plist"]
        outputFiles: ["$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchAgents/com.his1devil.lucicontrol.plist"]
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: LuciControl
        CFBundleDisplayName: LuciControl
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSPrincipalClass: NSApplication
        SUFeedURL: https://im.zhanghuanyang.com/lucirund/dist/appcast.xml
        SUPublicEDKey: Xv/Qaiz9k+0HaC2Lv5kL4QOMZiz8hpubsN9cIWIupvU=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SUScheduledCheckInterval: 86400
        NSHumanReadableCopyright: ''
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.his1devil.lucicontrol
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_INTEROP_MODE: objc
  LuciControlTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/App]
    dependencies:
      - target: LuciControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.his1devil.lucicontrol.tests
        GENERATE_INFOPLIST_FILE: 'YES'
