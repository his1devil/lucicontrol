name: LuciControl
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    macOS: '14.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: 'YES'
    ENABLE_USER_SCRIPT_SANDBOXING: 'NO'
packages:
  LuciControlCore:
    path: .
targets:
  LuciControl:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/Views
      - path: Resources
    dependencies:
      - package: LuciControlCore
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: LuciControl
        CFBundleDisplayName: LuciControl
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: ''
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.his1devil.lucicontrol
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_INTEROP_MODE: objc
  LuciControlTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/App]
    dependencies:
      - target: LuciControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.his1devil.lucicontrol.tests
        GENERATE_INFOPLIST_FILE: 'YES'
