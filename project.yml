name: LuciControl
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    macOS: '14.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: 'YES'
    ENABLE_USER_SCRIPT_SANDBOXING: 'NO'
packages:
  LuciControlCore:
    path: .
targets:
  LuciControl:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/Views
      - path: Resources
        excludes: [LaunchAgents]
    dependencies:
      - package: LuciControlCore
    preBuildScripts:
      - name: Build lucirund
        script: "\"$SRCROOT/scripts/build-daemon.sh\""
        outputFiles: ["$(SRCROOT)/build/lucirund"]
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Bundle lucirund
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH"
          cp -f "$SRCROOT/build/lucirund" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/lucirund"
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" --options runtime "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/lucirund" 2>/dev/null || true
        inputFiles: ["$(SRCROOT)/build/lucirund"]
        outputFiles: ["$(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/lucirund"]
      - name: Bundle launch agent
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents"
          cp -f "$SRCROOT/Resources/LaunchAgents/com.his1devil.lucicontrol.plist" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents/"
        inputFiles: ["$(SRCROOT)/Resources/LaunchAgents/com.his1devil.lucicontrol.plist"]
        outputFiles: ["$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchAgents/com.his1devil.lucicontrol.plist"]
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: LuciControl
        CFBundleDisplayName: LuciControl
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: ''
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.his1devil.lucicontrol
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_INTEROP_MODE: objc
  LuciControlTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/App]
    dependencies:
      - target: LuciControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.his1devil.lucicontrol.tests
        GENERATE_INFOPLIST_FILE: 'YES'
